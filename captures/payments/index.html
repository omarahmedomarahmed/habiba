</style></head><body class="bg-slate-50 p-6"><div class="mx-auto max-w-6xl"><h1 class="text-2xl font-bold tracking-tight text-slate-900">Payment surfaces</h1><p class="mt-1 text-sm text-slate-600">Every payer, every state. Figures from the product's own helpers; people are synthetic.</p><div class="mt-6 grid gap-6 sm:grid-cols-2 lg:grid-cols-3"><figure class="rounded-2xl border border-slate-200 bg-white p-3"><img src="patient-1-open.png" alt="patient-1-open" class="w-full rounded-xl border border-slate-100"><figcaption class="mt-2 text-xs leading-relaxed text-slate-600"><b class="text-slate-900">patient-1-open</b><br>A guest paying for a session. Open on arrival, because the link they followed exists to pay.</figcaption></figure><figure class="rounded-2xl border border-slate-200 bg-white p-3"><img src="patient-2-submitted.png" alt="patient-2-submitted" class="w-full rounded-xl border border-slate-100"><figcaption class="mt-2 text-xs leading-relaxed text-slate-600"><b class="text-slate-900">patient-2-submitted</b><br>They have sent the money and submitted a receipt. This is the state they come back to.</figcaption></figure><figure class="rounded-2xl border border-slate-200 bg-white p-3"><img src="patient-3-rejected.png" alt="patient-3-rejected" class="w-full rounded-xl border border-slate-100"><figcaption class="mt-2 text-xs leading-relaxed text-slate-600"><b class="text-slate-900">patient-3-rejected</b><br>Turned down, in the operator's own words. Paraphrasing this is how a payer transfers twice.</figcaption></figure><figure class="rounded-2xl border border-slate-200 bg-white p-3"><img src="patient-4-arabic.png" alt="patient-4-arabic" class="w-full rounded-xl border border-slate-100"><figcaption class="mt-2 text-xs leading-relaxed text-slate-600"><b class="text-slate-900">patient-4-arabic</b><br>The same sheet in Arabic, which is the language most of this market reads.</figcaption></figure><figure class="rounded-2xl border border-slate-200 bg-white p-3"><img src="clinician-1-open.png" alt="clinician-1-open" class="w-full rounded-xl border border-slate-100"><figcaption class="mt-2 text-xs leading-relaxed text-slate-600"><b class="text-slate-900">clinician-1-open</b><br>A pay-as-you-go clinician, with the two sessions this transfer covers printed under the total.</figcaption></figure><figure class="rounded-2xl border border-slate-200 bg-white p-3"><img src="clinic-1-open.png" alt="clinic-1-open" class="w-full rounded-xl border border-slate-100"><figcaption class="mt-2 text-xs leading-relaxed text-slate-600"><b class="text-slate-900">clinic-1-open</b><br>A clinic manager. Same sheet, and it says which payer it is for, because the bank details are identical for all four.</figcaption></figure><figure class="rounded-2xl border border-slate-200 bg-white p-3"><img src="company-1-choosing.png" alt="company-1-choosing" class="w-full rounded-xl border border-slate-100"><figcaption class="mt-2 text-xs leading-relaxed text-slate-600"><b class="text-slate-900">company-1-choosing</b><br>A company picks the figure on a stepper rather than typing it, so a slipped zero is work rather than an accident.</figcaption></figure><figure class="rounded-2xl border border-slate-200 bg-white p-3"><img src="company-2-confirmed.png" alt="company-2-confirmed" class="w-full rounded-xl border border-slate-100"><figcaption class="mt-2 text-xs leading-relaxed text-slate-600"><b class="text-slate-900">company-2-confirmed</b><br>Confirmed, with the way back to the product. A company buys a balance rather than a door.</figcaption></figure><figure class="rounded-2xl border border-slate-200 bg-white p-3"><img src="bar-1-open.png" alt="bar-1-open" class="w-full rounded-xl border border-slate-100"><figcaption class="mt-2 text-xs leading-relaxed text-slate-600"><b class="text-slate-900">bar-1-open</b><br>Opened and never submitted. Red, and it cannot be dismissed: this person may already have sent the money.</figcaption></figure><figure class="rounded-2xl border border-slate-200 bg-white p-3"><img src="bar-2-submitted.png" alt="bar-2-submitted" class="w-full rounded-xl border border-slate-100"><figcaption class="mt-2 text-xs leading-relaxed text-slate-600"><b class="text-slate-900">bar-2-submitted</b><br>Waiting for an operator. Amber, with an estimate it can keep.</figcaption></figure><figure class="rounded-2xl border border-slate-200 bg-white p-3"><img src="bar-3-confirmed.png" alt="bar-3-confirmed" class="w-full rounded-xl border border-slate-100"><figcaption class="mt-2 text-xs leading-relaxed text-slate-600"><b class="text-slate-900">bar-3-confirmed</b><br>Confirmed. Green, and this is the only one they may dismiss.</figcaption></figure><figure class="rounded-2xl border border-slate-200 bg-white p-3"><img src="patient-5-session-started.png" alt="patient-5-session-started" class="w-full rounded-xl border border-slate-100"><figcaption class="mt-2 text-xs leading-relaxed text-slate-600"><b class="text-slate-900">patient-5-session-started</b><br>The door is open. Sent the instant a clinician presses Start, and shown in the app as well.</figcaption></figure><figure class="rounded-2xl border border-slate-200 bg-white p-3"><img src="admin-1-transfer-queue.png" alt="admin-1-transfer-queue" class="w-full rounded-xl border border-slate-100"><figcaption class="mt-2 text-xs leading-relaxed text-slate-600"><b class="text-slate-900">admin-1-transfer-queue</b><br>One queue, four payers, a tab each. Every name links to that payer's own page on the admin side.</figcaption></figure><figure class="rounded-2xl border border-slate-200 bg-white p-3"><img src="admin-2-open-carts.png" alt="admin-2-open-carts" class="w-full rounded-xl border border-slate-100"><figcaption class="mt-2 text-xs leading-relaxed text-slate-600"><b class="text-slate-900">admin-2-open-carts</b><br>Money that arrived with no claim. Collapsed by default, and the only act on a row demands a written reason first.</figcaption></figure><figure class="rounded-2xl border border-slate-200 bg-white p-3"><img src="admin-3-payouts.png" alt="admin-3-payouts" class="w-full rounded-xl border border-slate-100"><figcaption class="mt-2 text-xs leading-relaxed text-slate-600"><b class="text-slate-900">admin-3-payouts</b><br>What we owe clinicians. Manual requests to work, and the automated records beside them.</figcaption></figure></div></div></body></html>
